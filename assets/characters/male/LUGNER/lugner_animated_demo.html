<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  
  html, body {
    margin: 0;
    padding: 0;
    width: 512px;   /* 320 * 1.6 */
    height: 787px;  /* 492 * 1.6 */
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  .stage {
    position: relative;
    width: 512px;
    height: 787px;
    background: transparent;
    overflow: visible;
  }

  .char-wrap {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 512px;
    height: 787px;
    transform: translateX(-50%) translateX(10px);
    transform-origin: center;
    background: transparent;
  }
  
  .body-static {
    position: absolute;
    top: 0; left: 0;
    width: 320px;
    height: 492px;
    background-image: url('LUGNER_FINAL_cropped_v2.png');
    background-size: 320px 492px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }

  /* clipped window over the chest/vest region, same image, animated scale */
  .torso {
    position: absolute;
    left: 155px;
    top: 170px;
    width: 90px;
    height: 110px;
    overflow: hidden;
    transform-origin: 50% 100%;
    animation: breathe 3.3s ease-in-out infinite;
  }

  .torso-img {
    position: absolute;
    left: -155px;  
    top: -170px;
    width: 320px;
    height: 492px;
    background-image: url('LUGNER_FINAL_cropped_v2.png');
    background-size: 320px 492px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }

  @keyframes breathe {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50%      { transform: scaleY(1.025) scaleX(1.01); }
  }

  /* ---------- EYES: iris + eyelid overlays ---------- */
  .eye {
    position: absolute;
    width: 14px;
    height: 10px;
  }

  #iris-left  { left: 160px; top: 128px; }  /* dati 148px, binawasan para umakyat */
  #iris-right { left: 208px; top: 128px; }  /* dapat magkatugma parehas */

  .iris-inner {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: iris-life 5.5s ease-in-out infinite;
    transform-origin: center;
  }
  #iris-right .iris-inner {
    animation-delay: 0.15s;
  }

  @keyframes iris-life {
    0%, 100%   { transform: translate(0,0) scale(1); }
    30%        { transform: translate(0.3px,-0.2px) scale(1.015); }
    55%        { transform: translate(-0.3px,0.15px) scale(0.99); }
    80%        { transform: translate(0.15px,0.25px) scale(1.01); }
  }

  /* Eyelids: flat skin-tone shapes that sweep down over the eye then back up */
  .eyelid {
    position: absolute;
    left: -3px;
    top: -2px;
    width: 20px; 
    height: 12px;
    pointer-events: none;
  }

  .eyelid-fill {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background: #f2d4b9;
    border-radius: 0% 0% 50% 50% / 0% 0% 50% 50%;
    transform-origin: top center;
    animation: blink 3s ease-in-out infinite;
  }
  #eyelid-right .eyelid-fill {
    animation-delay: 0.03s;
  }

@keyframes blink {
  0%, 85%, 100% {
    transform: scaleY(0) scaleX(1);   
  }
  90% {
    transform: scaleY(0.5) scaleX(1.05);   
  }
  93% {
    transform: scaleY(1.2) scaleX(1.4);    
  }
  96% {
    transform: scaleY(0.5) scaleX(1.05);   
  }
  99% {
    transform: scaleY(0) scaleX(1);       
  }
}

</style>
</head>
<body>

<div class="stage">
  <div class="char-wrap">

    <!-- Everything that does NOT move -->
    <div class="body-static"></div>

    <!-- Torso: breathing -->
    <div class="torso" id="torso">
      <div class="torso-img"></div>
    </div>

    <!-- Left eye (character's right, viewer's left) -->
    <div class="eye" id="iris-left">
      <div class="iris-inner"></div>
      <div class="eyelid" id="eyelid-left">
        <div class="eyelid-fill"></div>
      </div>
    </div>

    <!-- Right eye -->
    <div class="eye" id="iris-right">
      <div class="iris-inner"></div>
      <div class="eyelid" id="eyelid-right">
        <div class="eyelid-fill"></div>
      </div>
    </div>

  </div>
</div>

<script>
  
    // sa loob ng bawat *_animated_demo.html
  window.pauseAnimation = () => { /* i-cancel yung requestAnimationFrame loop */ };
  window.resumeAnimation = () => { /* i-restart */ };

</script>



</body>
</html>
