<rect id="eyelid-right" class="eyelid-right" x="648" y="486" width="46" height="34" fill="#FAD8B5" style="transform-box: view-box; transform-origin:671px 486px; transform:scaleY(0);"/>
</svg>
<div class="debug-controls" style="margin-top:1rem;">
  <button onclick="window.__blinkNow && window.__blinkNow()">Blink now</button>
</div>
</div>

<script>
(function(){
  var torso = document.querySelectorAll('.torso');
  var iris  = document.querySelectorAll('.iris-right');
  var lid   = document.getElementById('eyelid-right');

  var BREATHE_EASE = 'cubic-bezier(0.45, 0, 0.55, 1)';

  function setTransform(nodeList, transform, duration, ease){
    nodeList.forEach(function(el){
      el.style.transition = 'transform ' + duration + 'ms ' + ease;
      el.style.transform = transform;
    });
  }

  // sa loob ng bawat *_animated_demo.html
  window.pauseAnimation = () => { /* i-cancel yung requestAnimationFrame loop */ };
  window.resumeAnimation = () => { /* i-restart */ };

  var breatheDir = 1;
  function breatheStep(){
    var scale = breatheDir > 0 ? 1.032 : 1;
    var irisScale = breatheDir > 0 ? 1.05 : 1;
    setTransform(torso, 'scaleY(' + scale + ')', 2200, BREATHE_EASE);
    setTransform(iris, 'scale(' + irisScale + ')', 2200, BREATHE_EASE);
    breatheDir *= -1;
  }
  breatheStep();
  setInterval(breatheStep, 2200);

  function blink(){
    lid.style.transition = 'transform 85ms ease-in';
    lid.style.transform = 'scaleY(1)';
    setTimeout(function(){
      lid.style.transition = 'transform 160ms cubic-bezier(0.22, 1, 0.36, 1)';
      lid.style.transform = 'scaleY(0)';
    }, 120);
  }
  window.__blinkNow = blink;

  function scheduleBlink(){
    var delay = 2800 + Math.random() * 2400;
    setTimeout(function(){ blink(); scheduleBlink(); }, delay);
  }
  scheduleBlink();
})();
</script>
</body>
</html>
