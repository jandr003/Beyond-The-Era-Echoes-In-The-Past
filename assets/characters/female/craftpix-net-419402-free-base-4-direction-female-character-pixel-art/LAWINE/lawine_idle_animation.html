<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lawine Idle Animation</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(60vmin, 520px);
    aspect-ratio: 1 / 1;
  }

  .char-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    user-select: none;
    pointer-events: none;
  }

  .chest {
    position: absolute;
    left: 40.191%;
    top: 39.075%;
    width: 12.759%;
    height: 18.341%;
    transform-origin: 50% 100%;
    animation: breathe 3.6s ease-in-out infinite;
    image-rendering: pixelated;
    pointer-events: none;
  }

  .chest img {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  @keyframes breathe {
    0%   { transform: scaleY(1); }
    50%  { transform: scaleY(1.035); }
    100% { transform: scaleY(1); }
  }

  .eyelid {
    position: absolute;
    background: #f9dcc4;
    border-radius: 5px;
    transform-origin: 50% 0%;
    animation: blink 4.6s ease-in-out infinite;
  }

  .eyelid.left {
    left: 41.710%;
    top: 31.419%;
    width: 3.06%;
    height: 2.552%;
  }

  .eyelid.right {
    left: 48.80%;
    top: 31.419%;
    width: 3.06%;
    height: 2.552%;
  }

  @keyframes blink {
    0%   { transform: scaleY(0); }
    90%  { transform: scaleY(0); }
    92%  { transform: scaleY(1); }
    95%  { transform: scaleY(1); }
    97%  { transform: scaleY(0); }
    100% { transform: scaleY(0); }
  }

  .caption {
    position: absolute;
    bottom: -40px;
    left: 0;
    right: 0;
    text-align: center;
    color: #cfd3dc;
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.6;
  }
</style>
</head>
