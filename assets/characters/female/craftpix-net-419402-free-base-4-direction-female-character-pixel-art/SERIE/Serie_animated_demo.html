<div style="margin-top:1rem;">
  <button onclick="window.__blinkNow && window.__blinkNow()">Blink now</button>
</div>
</div>

<script>
(function(){
  var torso = document.querySelectorAll('.torso');
  var irisL = document.querySelectorAll('.iris-left');
  var irisR = document.querySelectorAll('.iris-right');
  var lidL  = document.getElementById('eyelid-left');
  var lidR  = document.getElementById('eyelid-right');

  var BREATHE_EASE = 'cubic-bezier(0.45, 0, 0.55, 1)';

  function setTransform(nodeList, transform, duration, ease){
    nodeList.forEach(function(el){
      el.style.transition = 'transform ' + duration + 'ms ' + ease;
      el.style.transform = transform;
    });
  }

  var breatheDir = 1;
  function breatheStep(){
    var scale = breatheDir > 0 ? 1.032 : 1;
    var irisScale = breatheDir > 0 ? 1.05 : 1;
    setTransform(torso, 'scaleY(' + scale + ')', 2200, BREATHE_EASE);
    setTransform(irisL, 'scale(' + irisScale + ')', 2200, BREATHE_EASE);
    setTransform(irisR, 'scale(' + irisScale + ')', 2200, BREATHE_EASE);
    breatheDir *= -1;
  }
  breatheStep();
  setInterval(breatheStep, 2200);

  function blink(){
    lidL.style.transition = 'transform 85ms ease-in';
    lidR.style.transition = 'transform 85ms ease-in';
    lidL.style.transform = 'scaleY(1)';
    lidR.style.transform = 'scaleY(1)';
    setTimeout(function(){
      lidL.style.transition = 'transform 160ms cubic-bezier(0.22, 1, 0.36, 1)';
      lidR.style.transition = 'transform 160ms cubic-bezier(0.22, 1, 0.36, 1)';
      lidL.style.transform = 'scaleY(0)';
      lidR.style.transform = 'scaleY(0)';
    }, 120);
  }
  window.__blinkNow = blink;

  function scheduleBlink(){
    var delay = 2800 + Math.random() * 2400;
    setTimeout(function(){ blink(); scheduleBlink(); }, delay);
  }
  scheduleBlink();
})();
</script>
