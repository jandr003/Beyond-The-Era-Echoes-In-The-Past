<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aura — Demo + Structured SVG Preview</title>
  <style>
    body{margin:0;padding:1rem;background:#111;color:#eee;font-family:sans-serif}
    .grid{display:flex;gap:1rem;max-width:1200px;margin:0 auto}
    .panel{flex:1;background:#151515;padding:0.5rem;border-radius:6px}
    iframe{width:100%;height:720px;border:0;background:white}
    .svg-wrap{width:100%;height:720px;overflow:auto}
    .controls{margin-top:0.5rem}
    button{padding:8px 12px;border-radius:6px;border:1px solid #444;background:#222;color:#eee;cursor:pointer}
  </style>
</head>
<body>
  <h3 style="text-align:center">Aura — Demo (left) and Structured SVG (right)</h3>
  <div class="grid">
    <div class="panel">
      <strong>Demo HTML</strong>
      <iframe src="Aura_animated_demo.html" title="Demo"></iframe>
    </div>
    <div class="panel">
      <strong>Structured SVG (inlined)</strong>
      <div id="svgTarget" class="svg-wrap" aria-live="polite"></div>
      <div class="controls">
        <button id="blinkBtn">Blink now</button>
      </div>
    </div>
  </div>

  <script>
  // load the structured svg and inject inline so we can animate internals
  (function(){
    var target = document.getElementById('svgTarget');
    fetch('Aura_structured.svg').then(function(r){ return r.text(); }).then(function(text){
      target.innerHTML = text;
      // ensure transforms use viewBox reference
      var svg = target.querySelector('svg');
      if(svg) svg.style.width = '100%';

      // hook up same animation logic as the demo but scoped to this injected svg
      var torso = target.querySelectorAll('.torso');
      var irisL = target.querySelectorAll('.iris-left');
      var irisR = target.querySelectorAll('.iris-right');
      var lidL  = target.querySelector('#eyelid-left');
      var lidR  = target.querySelector('#eyelid-right');

      function setTransform(nodeList, transform, duration){
        nodeList.forEach(function(el){
          el.style.transition = 'transform ' + duration + 'ms ease-in-out';
          el.style.transform = transform;
        });
      }

      // breathing
      var breatheDir = 1;
      function breatheStep(){
        var scale = breatheDir > 0 ? 1.035 : 1;
        var irisScale = breatheDir > 0 ? 1.08 : 1;
        setTransform(torso, 'scaleY(' + scale + ')', 1900);
        setTransform(irisL, 'scale(' + irisScale + ')', 1900);
        setTransform(irisR, 'scale(' + irisScale + ')', 1900);
        breatheDir *= -1;
      }
      breatheStep();
      setInterval(breatheStep, 1900);

      // blinking
      function blink(){
        if(!lidL || !lidR) return;
        lidL.style.transition = 'transform 90ms ease-in';
        lidR.style.transition = 'transform 90ms ease-in';
        lidL.style.transform = 'scaleY(1)';
        lidR.style.transform = 'scaleY(1)';
        setTimeout(function(){
          lidL.style.transition = 'transform 140ms ease-out';
          lidR.style.transition = 'transform 140ms ease-out';
          lidL.style.transform = 'scaleY(0)';
          lidR.style.transform = 'scaleY(0)';
        }, 130);
      }

      document.getElementById('blinkBtn').addEventListener('click', blink);

      function scheduleBlink(){
        var delay = 2600 + Math.random() * 2200;
        setTimeout(function(){ blink(); scheduleBlink(); }, delay);
      }
      scheduleBlink();
    }).catch(function(err){
      target.innerText = 'Failed to load Aura_structured.svg: ' + err;
    });
  })();
  </script>
</body>
</html>
