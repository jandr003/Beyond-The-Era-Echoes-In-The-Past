<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<title>Character Rig — Breathing Torso + Eyelid Blink</title>
<style>
  
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .panel {
    text-align: center;
  }
  
  .stage {
    position: relative;
    width: 380px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }
  
  .stage img {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  
  .body-static {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  /* Torso overlay perfectly aligns with the base sprite. */
  .torso {
    left: 32.30%;
    top: 35.09%;
    width: 35.09%;
    height: 30.70%;
    transform-origin: 50% 100%; /* anchor at the waist so the chest lifts on inhale */
    animation: breathe 3.6s ease-in-out infinite;
    will-change: transform;
  }
  
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
    45%      { transform: translateY(-1.5px) scaleY(1.008) scaleX(1.003); }
    55%      { transform: translateY(-1.5px) scaleY(1.008) scaleX(1.003); }
  }
  
  .eyelid {
    position: absolute;
    background: rgb(246, 213, 185);
    transform-origin: top center;
    transform: scaleY(0);
    will-change: transform;
  }
  
  #eyelid-left {
    left: 44.90%;
    top: 24.56%;
    width: 3.99%;
    height: 5.26%;
    animation: blink 4.2s infinite;
  }
  
  #eyelid-right {
    left: 51.28%;
    top: 24.56%;
    width: 3.83%;
    height: 5.26%;
    animation: blink 4.2s infinite;
  }
  
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(0); }
    92%           { transform: scaleY(1); }
    96%           { transform: scaleY(1); }
    98%           { transform: scaleY(0); }
  }
  
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  
  button {
    background: #2b2d38;
    color: #eee;
    border: 1px solid #444;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  
  button:hover { background: #383a48; }
  .note {
    color: #888;
    font-size: 12px;
    margin-top: 10px;
    max-width: 380px;
  }
  
</style>
</head>

<script>
  const torso = document.querySelector('.torso');
  function toggleBreathing() {
    torso.style.animationPlayState =
      torso.style.animationPlayState === 'paused' ? 'running' : 'paused';
  }
  
  function forceBlink() {
    const lids = document.querySelectorAll('.eyelid');
    lids.forEach(l => {
      l.style.animation = 'none';
      l.offsetHeight; 
      l.style.transform = 'scaleY(1)';
      setTimeout(() => {
        l.style.transform = 'scaleY(0)';
        setTimeout(() => { l.style.animation = 'blink 4.2s infinite'; }, 200);
      }, 140);
    });
  }
  
</script>
